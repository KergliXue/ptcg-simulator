# Ralts CS4a
cards.CS4a.Ralts.name=拉鲁拉丝
cards.CS4a.Ralts.attack.MemorySkip.name=记忆回避
cards.CS4a.Ralts.attack.MemorySkip.text=选择对手出战宝可梦持有的1个招式。在下个对手的回合，受到这个招式的宝可梦无法使用该招式。

# Kirlia CS4a
cards.CS4a.Kirlia.name=奇鲁莉安
cards.CS4a.Kirlia.power.Refinement.name=洗炼
cards.CS4a.Kirlia.power.Refinement.text=在自己的回合时，若从自己的手牌任意弃置1张卡，则可使用1次。自己从卡组抽2张卡。
cards.CS4a.Kirlia.attack.Slap.name=拍打
cards.CS4a.Kirlia.attack.Slap.text=无附加效果。

# Gardevoir ex CS4a
cards.CS4a.Gardevoirex.name=沙奈朵 ex
cards.CS4a.Gardevoirex.power.PsychicEmbrace.name=超能拥抱
cards.CS4a.Gardevoirex.power.PsychicEmbrace.text=在自己的回合，可不限次数地使用此力量。从自己的弃牌区选择1张「基本超能能量」卡，附于自己的「超」属性宝可梦身上。之后，在该宝可梦身上放置2个伤害指示物。（无法附于会因放置该指示物而气绝的宝可梦身上。）
cards.CS4a.Gardevoirex.attack.MiracleForce.name=奇迹力
cards.CS4a.Gardevoirex.attack.MiracleForce.text=这只宝可梦恢复所有特殊状态。

