# PTCG Coach - Nginx reverse proxy + static scans
# Usage: nginx -c /Users/kerglixue/dev/Code/PtcgCoach/nginx.conf
#
# To stop:  nginx -s stop -c /Users/kerglixue/dev/Code/PtcgCoach/nginx.conf

worker_processes 1;
error_log /Users/kerglixue/dev/Code/PtcgCoach/logs/nginx_error.log;
pid       /Users/kerglixue/dev/Code/PtcgCoach/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /Users/kerglixue/dev/Code/PtcgCoach/logs/nginx_access.log;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8090;
        server_name localhost;

        # Card images — served statically from assets/ directory
        location /v1/scans/ {
            alias /Users/kerglixue/dev/Code/PtcgCoach/assets/;
            try_files $uri =404;
        }

        # Avatar images
        location /v1/avatars/ {
            alias /Users/kerglixue/dev/Code/PtcgCoach/assets/avatars/;
            try_files $uri =404;
        }

        # API requests — proxy to Java backend
        location /v1/ {
            proxy_pass http://127.0.0.1:12022;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket / Socket.IO — proxy with upgrade headers
        location /socket.io/ {
            proxy_pass http://127.0.0.1:12022;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
    }
}